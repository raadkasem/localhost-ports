<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Localhost Ports Dashboard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>Localhost <em>Ports</em></h1>
        <p class="subtitle">Your running local services</p>
      </div>
      <div class="header-count" id="active-count" role="status"></div>
      <button id="refresh-btn" type="button" class="refresh-btn" title="Refresh services" aria-label="Refresh services">↻</button>
    </header>

    <!-- Scan status -->
    <div id="scan-status" class="scan-status" role="status">
      <div class="scan-spinner" aria-hidden="true"></div>
      <span>Scanning ports<span class="scan-dots">...</span></span>
    </div>

    <!-- Detected ports banner -->
    <div id="detected-section" class="detected-section hidden">
      <div class="detected-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>New ports detected</span>
      </div>
      <div id="detected-list" class="detected-list"></div>
    </div>

    <!-- Port list -->
    <section id="port-list" class="port-list" aria-label="Local services" aria-busy="true"></section>

    <!-- Add custom port -->
    <form id="add-port-form" class="add-port" novalidate>
      <div class="add-port-input-wrap">
        <svg class="add-port-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <label for="custom-port" class="sr-only">Custom port number</label>
        <input type="text" id="custom-port" placeholder="Add custom port..." inputmode="numeric" pattern="[0-9]+" maxlength="5" autocomplete="off" aria-describedby="feedback">
      </div>
      <button id="add-btn" type="submit" title="Add port" aria-label="Add custom port">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </form>
    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>

    <!-- Footer -->
    <footer class="footer">
      <span class="footer-text">crafted by</span>
      <a href="https://raadkasem.dev" target="_blank" rel="noopener" class="footer-link">raadkasem.dev</a>
      <span class="footer-sep">/</span>
      <a href="https://github.com/raadkasem" target="_blank" rel="noopener noreferrer" class="footer-github" title="GitHub" aria-label="GitHub profile">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
      </a>
    </footer>
  </div>

  <script src="shared.js"></script>
  <script src="scanner.js"></script>
  <script src="popup.js"></script>
</body>
</html>
